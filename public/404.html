<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <meta http-equiv="refresh" content="0; url=./index.html" />
    <script>
      // GitHub Pages serves this for unknown paths; re-enter the SPA via hash routing.
      var path = window.location.pathname;
      var appRoot = path.slice(0, path.indexOf('/404.html'));
      window.location.replace(appRoot + '/index.html#' + path.replace(appRoot, '') );
    </script>
  </head>
  <body>
    Redirecting to the app… <a href="./index.html">BD Career Tools</a>
  </body>
</html>
